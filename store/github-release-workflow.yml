name: Release HMCL CE Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: hmclce-plugin-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_MODE: ${{ vars.HMCLCE_PLUGIN_RELEASE_MODE || 'certified' }}
      HMCLCE_APPROVAL_API_URL: ${{ vars.HMCLCE_APPROVAL_API_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release configuration
        shell: pwsh
        run: |
          if ($env:RELEASE_MODE -notin @('community', 'certified')) {
            throw 'HMCLCE_PLUGIN_RELEASE_MODE must be community or certified.'
          }
          if ($env:RELEASE_MODE -eq 'certified' -and [string]::IsNullOrWhiteSpace($env:HMCLCE_APPROVAL_API_URL)) {
            throw 'Certified releases require repository variable HMCLCE_APPROVAL_API_URL.'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:HMCLCE_PLUGIN_SIGNING_KEY) -or
              -not [string]::IsNullOrWhiteSpace($env:HMCLCE_PLUGIN_CERTIFICATE)) {
            throw 'Remove legacy developer signing credentials. Certification now uses GitHub OIDC and the approval API.'
          }
      - name: Build NPL
        run: ./gradlew packageNpl
      - name: Validate and prepare NPL
        id: pkg
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path build/npl -Filter *.npl -File -Recurse)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one .npl package, found $($packages.Count)."
          }
          $package = $packages[0]
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($package.Name)"
          ./tools/validate-npl.ps1 -Package $package.FullName
          ./tools/sign-plugin.ps1 `
            -Manifest ./manifest.template.json `
            -Output ./manifest.pending.json `
            -Package $package.FullName `
            -PackageUrl $packageUrl `
            -Version $version `
            -Community
          "file=$($package.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($package.Name)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha256=$((Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "size=$($package.Length)" >> $env:GITHUB_OUTPUT
      - name: Create or update draft release
        id: draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.pkg.outputs.file }}
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
          PACKAGE_SHA256: ${{ steps.pkg.outputs.sha256 }}
          PACKAGE_SIZE: ${{ steps.pkg.outputs.size }}
        run: |
          $existing = $null
          try {
            $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          } catch {
            if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          }
          if ($null -ne $existing -and -not [bool]$existing.draft) {
            throw 'A published release already exists for this tag; published NPL bytes are immutable.'
          }
          if ($null -eq $existing) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft --title $env:GITHUB_REF_NAME --notes 'Certification pending.'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft GitHub Release.' }
          }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          $assets = @($release.assets | Where-Object { [string]$_.name -ceq $env:PACKAGE_NAME })
          if ($assets.Count -gt 1) { throw 'Draft release contains duplicate NPL assets with the same name.' }
          if ($assets.Count -eq 1) {
            $asset = $assets[0]
            if ([int64]$asset.size -ne [int64]$env:PACKAGE_SIZE) {
              throw 'Existing NPL asset differs from the local package; refusing to replace immutable release bytes.'
            }
            $remoteAsset = Join-Path $env:RUNNER_TEMP "hmclce-existing-$($asset.id).npl"
            Invoke-WebRequest `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" `
              -Headers @{
                Accept = 'application/octet-stream'
                Authorization = "Bearer $env:GH_TOKEN"
                'X-GitHub-Api-Version' = '2022-11-28'
              } `
              -OutFile $remoteAsset
            $remoteSha256 = (Get-FileHash -LiteralPath $remoteAsset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($remoteSha256 -cne $env:PACKAGE_SHA256) {
              throw 'Existing NPL asset differs from the local package; refusing to replace immutable release bytes.'
            }
            Write-Host "Reusing byte-identical draft NPL asset $($asset.id)."
          } else {
            gh release upload $env:GITHUB_REF_NAME $env:PACKAGE_FILE --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload the NPL to the draft release.' }
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
            $assets = @($release.assets | Where-Object { [string]$_.name -ceq $env:PACKAGE_NAME })
          }
          if ($assets.Count -ne 1) { throw 'Draft release does not contain exactly one matching NPL asset.' }
          "release_id=$($release.id)" >> $env:GITHUB_OUTPUT
          "asset_id=$($assets[0].id)" >> $env:GITHUB_OUTPUT
      - name: Request repository and NPL certification
        if: env.RELEASE_MODE == 'certified'
        shell: pwsh
        env:
          PACKAGE_FILE: ${{ steps.pkg.outputs.file }}
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
          ASSET_ID: ${{ steps.draft.outputs.asset_id }}
        run: |
          ./tools/request-certification.ps1 `
            -ApiBase $env:HMCLCE_APPROVAL_API_URL `
            -Repository $env:GITHUB_REPOSITORY `
            -Tag $env:GITHUB_REF_NAME `
            -CommitSha $env:GITHUB_SHA `
            -AssetId ([int64]$env:ASSET_ID) `
            -AssetName $env:PACKAGE_NAME `
            -Package $env:PACKAGE_FILE `
            -Manifest ./manifest.pending.json `
            -OutputManifest ./manifest.json `
            -OutputAttestation "./$($env:PACKAGE_NAME).attestation.json"
      - name: Finalize community manifest
        if: env.RELEASE_MODE == 'community'
        shell: pwsh
        run: Move-Item -LiteralPath ./manifest.pending.json -Destination ./manifest.json -Force
      - name: Upload approval metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
        run: |
          $files = @('./manifest.json')
          $attestation = "./$($env:PACKAGE_NAME).attestation.json"
          if (Test-Path -LiteralPath $attestation) { $files += $attestation }
          gh release upload $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release metadata.' }
      - name: Publish manifest on the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          generated_manifest="$RUNNER_TEMP/hmclce-manifest.json"
          cp manifest.json "$generated_manifest"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          cp "$generated_manifest" manifest.json
          if git diff --quiet -- manifest.json; then
            echo "Default-branch manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Publish HMCL CE plugin ${GITHUB_REF_NAME}"
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Publish approved release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          PACKAGE_SHA256: ${{ steps.pkg.outputs.sha256 }}
          PACKAGE_SIZE: ${{ steps.pkg.outputs.size }}
        run: |
          $notes = @(
            "SHA-256: $env:PACKAGE_SHA256"
            "Size: $env:PACKAGE_SIZE bytes"
            "Trust mode: $env:RELEASE_MODE"
          ) -join "`n"
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -F draft=false -f body="$notes" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the approved release.' }
